name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [product, devtools]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: uv sync

      - name: Ruff check
        working-directory: ${{ matrix.project }}
        run: uv run ruff check .

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: uv run pytest
